# Weekly dependency updates, opened as pull requests so check_gates decides
# whether they are safe rather than a human reading a version number.
#
# Grouped one pull request per ecosystem: these manifests hold a handful of
# build-time tools, and ten separate pull requests for them would be read by
# nobody. A group that fails is bisected by dropping a line from it.
#
# The actions are pinned by commit SHA (see .github/actions/setup). Dependabot
# understands that pinning and moves the SHA while keeping the version comment
# next to it - which is exactly why the pins are maintainable at all.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      # Tuesday, clear of the Monday morning bump workflows in
      # abap2UI5/linter's consumers, so the two do not open pull requests
      # against each other's lockfile changes on the same day.
      time: "06:30"
    open-pull-requests-limit: 5
    groups:
      toolchain:
        patterns: ["*"]

  # app/webapp is the UI5 source the frontend is built from; its own manifest
  # carries the UI5 tooling, and a bump there changes build/ - which the
  # frontend_check gate compares against the sources.
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: tuesday
      time: "06:30"
    open-pull-requests-limit: 5
    groups:
      ui5-tooling:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:30"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
