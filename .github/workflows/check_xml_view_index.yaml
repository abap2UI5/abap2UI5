name: check_xml_view_index

# Drift gate: .github/index/z2ui5_cl_xml_view.md is generated from the class and
# carries line numbers, so any edit to z2ui5_cl_xml_view shifts them. A stale
# index is worse than none - it sends readers to the wrong offset. Regenerate
# here and fail if the committed file differs.

on:
  pull_request:
    paths:
      - 'src/99/z2ui5_cl_xml_view.clas.abap'
      - '.github/index/**'
      - '.github/scripts/xml-view-index.mjs'
      - '.github/workflows/check_xml_view_index.yaml'

permissions:
  contents: read

jobs:
  check_xml_view_index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Regenerate index
        run: |
          npm ci
          npm run xml_view_index

      - name: Fail on drift
        run: |
          # stage first so a newly generated (untracked) index counts as drift too
          git add -A -- .github/index
          if ! git diff --cached --exit-code -- .github/index; then
            echo "::error::.github/index/z2ui5_cl_xml_view.md is out of sync with z2ui5_cl_xml_view."
            echo "Run 'npm run xml_view_index' locally and commit the regenerated index."
            exit 1
          fi
