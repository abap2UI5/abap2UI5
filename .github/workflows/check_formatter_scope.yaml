# Machine gate for the admission criteria of the curated formatter module
# (app/webapp/model/formatter.js). abap2UI5 is a thin frontend: the backend
# decides, the frontend renders. That module is the one place where the
# framework ships JS an app's view calls on its data, so every function
# admitted moves a decision out of ABAP - and pulling one back out later
# breaks the apps that adopted it (the stock/delivery status pack was shipped
# and removed exactly that way).
#
# .github/scripts/formatter-scope-gate.mjs enforces the two criteria a machine
# can check: the export surface must match its MANIFEST, where every entry
# names why it cannot be computed in ABAP (a closed set of reasons), and the
# module must hardcode no UI5 ValueState and no sap-icon:// URI - the shape of
# a business-status-to-visual lookup, which is classification and belongs in
# the backend. The third criterion (a formatter reads only the one value it
# formats) needs a reader and stays reviewer-enforced.
name: check_formatter_scope

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'app/webapp/model/formatter.js'
      - 'app/webapp/Util.js'
      - 'src/01/03/z2ui5_cl_app_formatter_js.clas.abap'
      - '.github/scripts/formatter-scope-gate.mjs'
      - '.github/workflows/check_formatter_scope.yaml'

concurrency:
  group: check_formatter_scope-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check_formatter_scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: curated formatters stay a marshalling layer, not app logic
        run: node .github/scripts/formatter-scope-gate.mjs
