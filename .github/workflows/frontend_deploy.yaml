name: frontend_deploy

# Pushes the generated deploy branches into abap2UI5/frontend, which is a pure
# delivery repository - every branch there is written by this workflow, nothing
# in it is edited by hand.
#
# The four published branches are NOT built here: their trees are committed in
# build/, gated against the sources by frontend_check, and this workflow ships
# the tree as it stands. So what a pull request reviewed is what reaches an
# installation - a rebuild at deploy time could only ever produce something
# nobody looked at. Renamed variants (standard_<name>) have no committed tree,
# are unbounded in number and stay built on demand through the dispatch input.
#
# The commit written into the delivery branch carries the subject of the main
# commit that caused it, plus that commit's sha - so the history over there
# reads like the history here instead of a column of "build:" lines. A push
# whose tree matches the published one is skipped, so an unrelated edit costs a
# run and not a commit.
#
# The monthly schedule is the safety net the delivery repository used to have:
# a lost or failed run would otherwise leave the branches silently behind main
# until somebody notices a fix that never arrived.
#
# The branches are an installation source - people's abapGit repositories point
# at them - so the tree a branch carries may not change just because the build
# moved. frontend_check.yaml guards the content on every pull request, and
# `npm run frontend:verify` compares a build against what is published.

on:
  push:
    branches: [main]
    paths:
      # what is delivered, verbatim - the sources it is built from only matter
      # here through the tree they produced
      - 'build/**'
      # the VERSION stamp of every branch carries the framework version
      - 'src/02/z2ui5_if_app.intf.abap'
      - 'tools/branch-stamp.mjs'
      - '.github/workflows/frontend_deploy.yaml'
  schedule:
    - cron: '0 5 1 * *'   # monthly safety net
  workflow_dispatch:
    inputs:
      branch:
        description: "Leave empty for all four published branches, or name one: cloud | cloud_v2 | standard | standard_v2 | standard_<name> | standard_v2_<name>"
        required: false
        type: string

permissions:
  contents: read

jobs:
  # Which branches this run builds: the one that was asked for, or the four
  # published ones. A dispatch input reaches a shell and a matrix, so it is
  # validated here rather than trusted - build-branches.mjs rejects an unknown
  # branch, but only after the value has been through both.
  prepare:
    if: github.repository == 'abap2UI5/abap2UI5'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      branches: ${{ steps.pick.outputs.branches }}
    steps:
      - name: Pick branches
        id: pick
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          if [ -z "${BRANCH:-}" ]; then
            echo 'branches=["cloud","cloud_v2","standard","standard_v2"]' >> "$GITHUB_OUTPUT"
            echo "building all four published branches"
            exit 0
          fi
          if ! printf '%s' "$BRANCH" | grep -Eq '^[A-Za-z0-9_#]+$'; then
            echo "::error::Invalid branch name '$BRANCH'"
            exit 1
          fi
          printf 'branches=["%s"]\n' "$BRANCH" >> "$GITHUB_OUTPUT"
          echo "building $BRANCH"

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.prepare.outputs.branches) }}
    permissions:
      contents: read
      issues: write  # to report failed scheduled runs
    concurrency:
      group: frontend_deploy-${{ matrix.branch }}
      cancel-in-progress: false
    env:
      BRANCH: ${{ matrix.branch }}
      TARGET: git@github.com:abap2UI5/frontend.git
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci

    # The four published branches are committed in build/ and are shipped as
    # they stand - not rebuilt, so a deploy cannot produce a tree no pull
    # request ever saw. Anything else (a renamed standard_<name>) has no
    # committed tree and is built here.
    - name: Assemble ${{ matrix.branch }}
      run: |
        set -euo pipefail
        b="$BRANCH"
        if [ -d "build/$b" ]; then
          source="build/$b"
          echo "$b: shipped from build/$b"
        else
          node tools/build-branches.mjs "$b"
          source="tools/out/$b"
          echo "$b: no committed tree, built on demand"
        fi
        rm -rf "$RUNNER_TEMP/tree-$b"
        cp -a "$source" "$RUNNER_TEMP/tree-$b"
        echo "SOURCE=$source" >> "$GITHUB_ENV"
        echo "TREE=$RUNNER_TEMP/tree-$b" >> "$GITHUB_ENV"

    - name: Check the BSP page invariants
      run: node tools/check-pages.mjs "$BRANCH"

    # In the workspace copy, so npx resolves the installed abaplint
    - name: Lint the generated standard src
      if: startsWith(matrix.branch, 'standard') && !startsWith(matrix.branch, 'standard_v2')
      run: cd "$SOURCE" && npx abaplint

    - name: Push ${{ matrix.branch }}
      env:
        DEPLOY_KEY: ${{ secrets.ACTION_KEY_FRONTEND }}
      run: |
        set -euo pipefail
        b="$BRANCH"

        mkdir -p ~/.ssh
        printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
        chmod 600 ~/.ssh/id_deploy
        ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
        export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes"

        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'

        # The published branch, if it exists, becomes the parent - so the
        # delivery repository keeps a history instead of an orphan per run.
        # Only that one parent: the core commit is not an object over there.
        parent=$(git fetch --depth 1 "$TARGET" "$b" 2>/dev/null && git rev-parse FETCH_HEAD || true)

        write_tree() {
          index="$RUNNER_TEMP/index-$b"
          rm -f "$index"
          (cd "$1" && GIT_DIR="$GITHUB_WORKSPACE/.git" GIT_WORK_TREE=. GIT_INDEX_FILE="$index" git add -A)
          GIT_INDEX_FILE="$index" git write-tree
        }

        # Is this the content the branch already carries? Answered by stamping
        # a copy with the commit the published VERSION names: if that
        # reproduces the published tree, the only thing this run would change
        # is the provenance - and a commit that moves the stamp forward without
        # moving the content is exactly the noise this delivery history is
        # supposed to be free of. The branch keeps naming the commit its
        # content actually came from.
        if [ -n "$parent" ]; then
          published=$(git show "$parent:VERSION" 2>/dev/null \
            | sed -n 's|^webapp mirror commit: abap2UI5/abap2UI5@||p' || true)
          if printf '%s' "$published" | grep -Eq '^[0-9a-f]{40}$'; then
            rm -rf "$TREE.published"
            cp -a "$TREE" "$TREE.published"
            node tools/branch-stamp.mjs "$TREE.published" "$b" "$published"
            if [ "$(write_tree "$TREE.published")" = "$(git rev-parse "$parent^{tree}")" ]; then
              echo "$b: unchanged, nothing to push"
              exit 0
            fi
          fi
        fi

        node tools/branch-stamp.mjs "$TREE" "$b" "$GITHUB_SHA"
        tree=$(write_tree "$TREE")

        # The subject of the commit that caused this delivery, so the branch
        # history over there reads like the history here; the sha is the body,
        # because it is not an object in that repository and only a reference.
        subject=$(git log -1 --format=%s "$GITHUB_SHA")
        commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} \
          -m "$subject" -m "abap2UI5/abap2UI5@$GITHUB_SHA")
        git push "$TARGET" "$commit:refs/heads/$b"
        echo "$b: pushed $commit"

    - name: Report scheduled failure as issue
      if: failure() && github.event_name == 'schedule'
      uses: ./.github/actions/report-scheduled-failure
