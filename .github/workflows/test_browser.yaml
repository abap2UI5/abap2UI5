name: test_browser

on:
  pull_request:

concurrency:
  group: test_browser-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test_unit_js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - uses: ./.github/actions/setup
      with:
        npm-ci: "true"
    - name: Run JS unit tests
      run: npm run check:js

  test_browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - uses: ./.github/actions/setup
      with:
        npm-ci: "true"
    - run: npm run downport
    - run: npm run auto_transpile
    - name: Get Playwright version
      id: playwright-version
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps
    - name: Install Playwright OS dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps
    - name: Run browser tests against the transpiled backend
      # the latest-UI5 run across all three engines; the ui5-1.71 project
      # runs separately below so its result is visible as its own step
      run: cd node && npx playwright test --config=playwright.config.js --project=chromium --project=firefox --project=webkit
    - name: Run the pinned OpenUI5 1.71 gate (smoke + roundtrip)
      # Executable check for the 1.71 compatibility rules (AGENTS.md rules
      # 12, 13, 15-18): the same shell smoke + roundtrip specs against the
      # oldest supported UI5 release, pinned in playwright.config.js.
      run: cd node && npx playwright test --config=playwright.config.js --project=ui5-1.71
