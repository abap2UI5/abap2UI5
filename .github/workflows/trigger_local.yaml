name: trigger_local

# Keeps abap2UI5/abap2UI5-local in sync with this repository: every push to
# main refreshes the input/ copy in abap2UI5-local and pushes it to its main
# branch via a deploy key. That push then triggers the
# generate_702/standard/cloud workflows over there, which rebuild the artifact
# branches. The monthly update_input cron in abap2UI5-local remains as a
# safety net.
#
# abap2UI5/frontend used to be kept in sync the same way (create_frontend,
# which mirrored app/webapp into its main). It no longer is: the frontend
# build lives here now, and frontend_deploy.yaml pushes finished branches
# there instead of a source to build from.
#
# Requires the secret ACTION_KEY_LOCAL: the private half of a deploy key
# registered on abap2UI5/abap2UI5-local with write access (same pattern as
# ACTION_KEY_FRONTEND for the frontend repository).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trigger_local
  cancel-in-progress: false

jobs:
  trigger_local:
    if: github.repository == 'abap2UI5/abap2UI5'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout abap2UI5 (this repo)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: upstream

    - name: Checkout abap2UI5-local via deploy key
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: abap2UI5/abap2UI5-local
        ref: main
        ssh-key: ${{ secrets.ACTION_KEY_LOCAL }}
        path: local

    # The one job that cannot use ./.github/actions/setup: both checkouts go
    # into subdirectories (upstream/, local/), so there is no repository at
    # the workspace root for a local action to be loaded from - and no
    # package-lock.json there to key an npm cache on either.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'

    # Same refresh as update_input in abap2UI5-local (shared script kept
    # there), only running here so it happens on every upstream push
    # instead of once a month.
    - name: Refresh input, lint and push to abap2UI5-local main
      run: bash local/.github/scripts/refresh_input.sh "$GITHUB_WORKSPACE/upstream/src" "$GITHUB_SHA"
