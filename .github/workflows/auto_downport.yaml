name: auto_downport

# Scoped by paths: the 702 branch is a function of src/, the 702 lint
# config and the downport tooling - a docs-only push to main changed none
# of its inputs and still rebuilt and force-pushed the branch. Not a
# required check, so a paths filter is safe here (contrast check_gates.yaml,
# where "a check that does not run cannot be required").
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'abaplint.jsonc'
      - '.abapgit.xml'
      - '.github/abaplint/**'
      - 'node/setup/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/auto_downport.yaml'
      - '.github/actions/**'

concurrency:
  group: auto_downport

permissions:
  contents: read

jobs:
  auto_downport:
    if: github.repository == 'abap2UI5/abap2UI5'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: ./.github/actions/setup
      with:
        npm-ci: "true"
        # auto_downport clones the three pinned git dependencies - cache
        # them instead of re-cloning on every push to main
        deps: "true"

    - run: npm run auto_downport

    - name: Commit and Push Changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add .
        git diff --staged --quiet || git commit -m "Downport changes"
        git checkout -b 702
        git push --force origin HEAD:702
