name: check_app2abap

# Drift gate: a PR that changes app/webapp but forgets to regenerate the
# embedded ABAP under src/01/03 (or leaves app/webapp un-prettier'd) would make
# main briefly inconsistent until the post-merge create_app2abap bot PR lands.
# Run the exact regeneration pipeline here and fail if anything it owns differs
# from what was committed, so the drift is caught on the PR instead.

on:
  pull_request:
    paths:
      - 'app/webapp/**'
      - 'src/01/03/**'
      - 'tools/app2abap/**'
      # `npm run app2abap` starts with `npm --prefix app run format`, so
      # Prettier's version and its configuration decide the bytes that end up
      # in src/01/03 just as much as the sources above do. A bump in app's
      # lockfile or a rule change in .prettierrc reformats app/webapp and
      # regenerates every carrier - and without these lines the gate that
      # notices that would not have started. Same bug class the comments in
      # render-gate.yaml (package-lock) and frontend_check.yaml (terser) name.
      - 'app/package.json'
      - 'app/package-lock.json'
      - 'app/.prettierrc'
      - '.github/workflows/check_app2abap.yaml'
  # A merge is not a state any pull request tested, and create_app2abap.yaml
  # regenerates from main on every push. Same pattern - paths repeated and all -
  # as frontend_check.yaml.
  push:
    branches: [main]
    paths:
      - 'app/webapp/**'
      - 'src/01/03/**'
      - 'tools/app2abap/**'
      - 'app/package.json'
      - 'app/package-lock.json'
      - 'app/.prettierrc'

concurrency:
  group: check_app2abap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check_app2abap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          app-npm-ci: "true"
          npm-ci: "true"

      - name: Regenerate embedded frontend
        run: npm run app2abap

      - name: Fail on drift
        run: |
          # stage first so newly generated (untracked) files count as drift too
          git add -A -- app/webapp src/01/03
          if ! git diff --cached --exit-code -- app/webapp src/01/03; then
            echo "::error::app/webapp and src/01/03 are out of sync."
            echo "Run 'npm run app2abap' locally and commit the regenerated src/01/03 (and any prettier changes)."
            exit 1
          fi
