name: auto_abaplint_fix_pr

# Formats a pull request in place: prettier over app/webapp, regenerate the
# embedded frontend under src/01/03, abaplint --fix over src/.
#
# Paths-filtered, unlike the gates: this one pushes a commit rather than
# reporting a check, so nothing is waiting on its name and a run it skips is
# a run with nothing to format. It was doing both `npm ci` AND
# `npm --prefix app ci` - the two most expensive installs here - on
# documentation- and backlog-only pull requests, to reformat files none of
# them touched.
#
# The paths are the union of what `npm run app2abap` reads and writes, which
# is `check_app2abap.yaml`'s list plus `src/**` for the abaplint --fix pass.

on:
  pull_request:
    paths:
      - 'app/webapp/**'
      - 'src/**'
      - 'tools/app2abap/**'
      - '.github/abaplint/auto_abaplint_fix.jsonc'
      - '.github/workflows/auto_abaplint_fix_pr.yaml'

concurrency:
  group: auto_abaplint_fix_pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  auto_abaplint_fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - uses: ./.github/actions/setup
        with:
          app-npm-ci: "true"
          npm-ci: "true"

      - name: Run app2abap and abaplint autofix
        run: npm run app2abap

      - name: Commit and push fixes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "auto app2abap + abaplint autofix formatting"
