# Machine gate for AGENTS.md rule 5: the public API under src/02/ is a stable
# contract - existing public methods, attributes, constants and types must
# never be removed or changed (additive changes are allowed but must be
# recorded in the snapshot, so every API change is explicit in the PR diff).
#
# .github/scripts/api-snapshot.mjs extracts the public signatures of every
# src/02 class/interface and compares them against the committed
# .github/api-snapshot.json. A removed or changed signature fails the PR and
# must be reverted - never "fixed" by rewriting the snapshot. An addition
# fails until the snapshot is regenerated (--write) and committed alongside.
name: check_api_contract

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/02/**'
      - '.github/api-snapshot.json'
      - '.github/scripts/api-snapshot.mjs'
      - '.github/workflows/check_api_contract.yaml'

concurrency:
  group: check_api_contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check_api_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: public API unchanged (additions recorded)
        run: node .github/scripts/api-snapshot.mjs
