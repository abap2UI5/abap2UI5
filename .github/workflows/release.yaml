name: release
# Cuts a release from one tag: the GitHub release for `X.Y.Z`, and the
# `X.Y.Z-702` tag on the downported branch.
#
# Why this exists: releases were cut entirely by hand, and the cost of that was
# visible in the ecosystem rather than in this repository.
# `z2ui5_cl_ui5_view_builder` reached main on 2026-08-12 while the newest tag
# was still 1.142.0 (2026-07-20), so for four days the samples,
# samples-controls, samples-stack, app-template and the documentation all
# taught a builder that NO released version carried, and abap2UI5/app-template
# could not pin its abaplint dependency to a tag at all - it had to resolve the
# framework from `main`. 1.143.0 closed that gap. A release that is a chore
# gets skipped; one that is a tag push does not.
#
# No current version number is repeated here on purpose: it is a moving value
# in a comment nothing checks, and the one that used to stand here went two
# releases stale. `changelog.txt` and `npm run check:release` are where the
# versions live.
#
# What it does NOT do is decide. It publishes what the tag points at, after
# checking that the tree agrees with itself:
#
#   - the tag, package.json and z2ui5_if_app=>version name the same version
#   - changelog.txt has a section for it (release-gate.mjs)
#   - the full `npm run verify` passes on the tagged commit, not on whatever
#     was green on main that day
#
# To cut a release:
#
#   1. move the `unreleased` entries in changelog.txt under a
#      `<YYYY-MM-DD> vX.Y.Z` heading
#   2. bump package.json AND src/02/z2ui5_if_app.intf.abap
#   3. npm run check:release          (the same gate this job runs)
#   4. commit, then: git tag X.Y.Z && git push origin main X.Y.Z
#      (by name: --follow-tags skips the lightweight tag `git tag` makes)
#   5. once this job is green: the section on the docs changelog page
#
# RELEASING.md is the longer version, including what is not automated.
#
# Dispatching this workflow by hand runs every check and builds the notes
# WITHOUT publishing anything - the rehearsal.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'abap2UI5/abap2UI5'
    permissions:
      contents: write
      # gh workflow run backend-prebuilt.yaml (see the last step)
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # the 702 tag is placed on the derived branch, which has to be fetched
        fetch-depth: 0

    - uses: ./.github/actions/setup
      with:
        npm-ci: "true"
        # verify runs check -> deps, which clones the three pinned git
        # dependencies - cache them like every other verifying job
        deps: "true"

    # Everything the tag claims, before anything is published. Catching a
    # mismatch here costs a minute; catching it afterwards costs a version
    # number, because a tag that has been pushed has already been fetched.
    - name: The tag, the two versions and the changelog agree
      # the ref through env, never interpolated into the script, like every
      # other workflow here - the tag glob above constrains it today, but a
      # rule that holds by accident is one the next edit of the glob breaks
      env:
        TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      run: node .github/scripts/release-gate.mjs ${TAG:+--tag "$TAG"}

    # On the exact commit being released. `verify` is the whole thing: abaplint
    # for standard and cloud, every gate, the downport, the transpiled unit
    # suite, the JS specs and the two generated trees.
    #
    # ABAP2UI5_RELEASING names the version for changelog-gate: its section on
    # the docs changelog page can only be written after this job has created
    # the release (the docs site's own gate waits for it), so that one version
    # may be missing there - on a tag and on the rehearsal alike.
    - name: npm run verify
      run: ABAP2UI5_RELEASING="$(node -p "require('./package.json').version")" npm run verify

    # The changelog section for this version, as the release body. Written from
    # the file rather than by hand, so the release notes and the changelog can
    # never say different things.
    - name: Release notes from changelog.txt
      id: notes
      run: |
        VERSION="$(node -p "require('./package.json').version")"
        node -e '
          const fs = require("fs");
          const version = process.argv[1];
          const text = fs.readFileSync("changelog.txt", "utf8");
          const heads = [...text.matchAll(/^(\d{4}-\d{2}-\d{2}) v(\d+\.\d+\.\d+)\s*\n-{5,}\s*$/gm)];
          const at = heads.findIndex((h) => h[2] === version);
          if (at === -1) { console.error(`no changelog section for ${version}`); process.exit(1); }
          const start = heads[at].index + heads[at][0].length;
          const end = at + 1 < heads.length ? heads[at + 1].index : text.length;
          fs.writeFileSync("release-notes.md", text.slice(start, end).trim() + "\n");
        ' "$VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "--- release notes ---"
        cat release-notes.md

    - name: Publish the release
      if: github.ref_type == 'tag'
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.notes.outputs.version }}
      run: |
        gh release create "$VERSION" \
          --title "$VERSION" \
          --notes-file release-notes.md \
          --verify-tag

    # A release created with the workflow's own GITHUB_TOKEN raises no
    # `release: published` run anywhere: GitHub does not start workflows for
    # events that token produced (the same rule autofix.yaml's header records
    # for its commits). backend-prebuilt.yaml listens for exactly that event,
    # so every release cut here shipped without its backend asset - 1.144.1
    # has none. Dispatch it by name instead, with the tag the event would
    # have carried; the workflow's own concurrency group makes a second run
    # for the same tag wait rather than race.
    - name: Attach the prebuilt backend
      if: github.ref_type == 'tag'
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.notes.outputs.version }}
      run: gh workflow run backend-prebuilt.yaml -f tag="$VERSION"

    # The 702 branch is rebuilt from main by auto_downport on every push, so at
    # tag time it usually carries the downport of this commit. Tagging it is
    # what gives a 7.02 system something immutable to install - the same
    # promise the main tag makes, for the other half of the supported range.
    #
    # Usually, not always: auto_downport is asynchronous and force-pushes the
    # branch, so its head names whatever main commit it was last built from.
    # Still running on the release commit, the head names an older one; a
    # push to main after the release commit (1.148.0: #2923 landed between
    # the merge of the cut and the tag), a newer one - and the build of the
    # release commit is gone from the branch, a force-push keeps no history.
    # Both used to fail this step. Now the head is tagged only when its
    # Source-Commit trailer names the release commit; otherwise the job
    # builds that downport itself, exactly as auto_downport does (a worktree
    # at the release commit, `npm run auto_downport`, the 702 lint, the same
    # commit with the same trailer), and tags that commit. The build is a
    # function of the commit: for 1.148.0 the rebuild's tree was identical,
    # hash for hash, to the 702 head auto_downport had pushed. The branch
    # itself is never pushed from here - it stays auto_downport's.
    - name: Tag the downported branch
      if: github.ref_type == 'tag'
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.notes.outputs.version }}
      run: |
        git fetch origin 702:702
        echo "702 head: $(git log -1 --format='%h %s' 702)"
        TARGET=702
        if ! git log -1 --format=%B 702 | grep -q "Source-Commit: $GITHUB_SHA"; then
          echo "::notice::The 702 head names $(git log -1 --format=%B 702 | sed -n 's/^Source-Commit: //p' | cut -c1-12), not the release commit - downporting $GITHUB_SHA here, as auto_downport does."
          WT="$RUNNER_TEMP/downport-702"
          git worktree add --detach "$WT" "$GITHUB_SHA"
          (
            cd "$WT"
            npm ci --no-audit --no-fund
            npm run auto_downport
            npx abaplint
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add .
            git diff --staged --quiet || git commit -m "Downport changes" -m "Source-Commit: $GITHUB_SHA"
          )
          TARGET="$(git -C "$WT" rev-parse HEAD)"
          echo "702 build of the release commit: $(git log -1 --format='%h %s' "$TARGET")"
        fi
        git tag "$VERSION-702" "$TARGET"
        git push origin "$VERSION-702"
        gh release create "$VERSION-702" \
          --title "$VERSION-702" \
          --notes "The 7.02-downported build of [$VERSION](../../releases/tag/$VERSION), generated from \`main\` by \`auto_downport\`. Same content, downported sources; install this one on NW 7.02-7.4x." \
          --verify-tag
