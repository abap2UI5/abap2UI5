name: delivery-check

# Pre-merge gate for what this repository delivers besides its ABAP sources:
# the BSP tooling and the tree of the branch `cloud`.
#
#   @abap2ui5/bsp   tools/bsp writes the BSP of src/03/02 (npm run app2abap)
#                   and is published for any other UI5 app to become one: its
#                   page format, its refusals, and a webapp through app2bsp,
#                   check and bsp2app and back, byte for byte
#   cloud           tools/build-cloud.mjs builds the branch's tree into the
#                   git-ignored tools/out/cloud. auto-cloud.yaml runs the same
#                   build on main and publishes it, so a build that fails
#                   fails here first
#
# The BSP itself needs no build here: it is committed (src/03/02), generated
# with src/01/03 and held to its source by check_app2abap.yaml. What lints
# the service packages is abaplint.yaml (npm run check:service).
#
# Until 2026-11 this was frontend_check, which built the branches of
# abap2UI5/frontend - a repository of its own next to the backend.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'cloud/**'
      - 'app_source/**'
      - 'tools/**'
      - '.abapgit.xml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/delivery-check.yaml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'cloud/**'
      - 'app_source/**'
      - 'tools/**'
      - '.abapgit.xml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: delivery-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup
      with:
        npm-ci: "true"

    - name: Test @abap2ui5/bsp
      run: npm run test:bsp

    - name: Build the tree of the branch cloud
      run: npm run cloud:build
