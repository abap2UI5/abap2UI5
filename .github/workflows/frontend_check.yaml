name: frontend_check

# Pre-merge gate for the generated deploy branches. This is the check the
# split into two repositories made impossible: the BSP packaging is built from
# the SAME webapp the pull request changes, before it is merged, instead of
# failing in the other repository afterwards.
#
# It builds every branch variant into the gitignored tools/out/ and lints the
# generated ABAP. It does NOT push - deploying is frontend_deploy.yaml, which
# runs the same build on main and ships what it built. No tree is committed
# in this repository: the delivered copies live in abap2UI5/frontend
# (result/<branch> on its main), and what ties the reviewed sources to the
# delivered bytes is this build running identically here and at deploy time.

on:
  # app/ and not just app/webapp/: the cloud branches ship the whole Fiori
  # project, so ui5.yaml or package.json changes what is delivered too.
  pull_request:
    paths:
      - 'app/**'
      - 'frontend/**'
      - 'tools/**'
      # the BSP preload bundle is minified with the installed terser, so a
      # dependency bump can change the built trees without touching any
      # source above
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend_check.yaml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'frontend/**'
      - 'tools/**'
      # the BSP preload bundle is minified with the installed terser, so a
      # dependency bump can change the built trees without touching any
      # source above
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

# The most expensive pull-request job in the repository - four delivery trees,
# a renamed BSP variant and two abaplint passes, budgeted at 15 minutes - and
# the only one that had no concurrency group, so a three-commit push burst ran
# it three times to completion. Same shape as every other workflow here.
concurrency:
  group: frontend_check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup
      with:
        npm-ci: "true"

    # The ICF/BSP handler sources this repository ships to the deploy branches
    - name: Lint frontend/abap
      run: npm run frontend:lint

    # The same build frontend_deploy runs at deploy time, into the gitignored
    # tools/out/ - failing here is what keeps a broken build away from main.
    - name: Build the four delivery trees
      run: npm run frontend:build

    # The renamed variant is built on demand by frontend_deploy; it is built
    # here too because the rename rewrites the generated page and has its own
    # way of going wrong.
    - name: Build a renamed variant
      run: node tools/build-branches.mjs standard_zcheck

    # Same abaplint run the standard branch gets in its own repository
    - name: Lint the generated standard tree
      run: cd tools/out/standard && npx abaplint

    # The invariants a BSP page has to satisfy, checked on the artefact rather
    # than on the bundle it was made from: a page line is at most 255
    # characters, a page name carries no character CREATE_NEW_PAGE rejects, and
    # the preload page is still valid JavaScript once padded.
    - name: Check the BSP page invariants
      run: node tools/check-pages.mjs
