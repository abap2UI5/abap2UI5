name: frontend_check

# Pre-merge gate for the generated deploy branches. This is the check the
# split into two repositories made impossible: the BSP packaging is built from
# the SAME webapp the pull request changes, before it is merged, instead of
# failing in the other repository afterwards.
#
# It builds every branch variant and lints the generated ABAP. It does NOT
# push - deploying is frontend_deploy.yaml.
#
# The first step is the one that makes build/ trustworthy: the four published
# trees are committed in this repository, so a pull request that changes the
# webapp has to carry the rebuilt trees with it (`npm run check:frontend`).
# Same contract as src/01/03 against app/webapp - what is delivered is
# reviewable in the diff, and frontend_deploy pushes exactly what was
# reviewed instead of building its own copy of it afterwards.

on:
  # app/ and not just app/webapp/: the cloud branches ship the whole Fiori
  # project, so ui5.yaml or package.json changes what is delivered too.
  pull_request:
    paths:
      - 'app/**'
      - 'frontend/**'
      - 'tools/**'
      # a hand-edit of the committed trees is caught by the same gate
      - 'build/**'
      # the BSP preload bundle is minified with the installed terser, so a
      # dependency bump can change build/ without touching any source above
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend_check.yaml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'frontend/**'
      - 'tools/**'
      # a hand-edit of the committed trees is caught by the same gate
      - 'build/**'
      # the BSP preload bundle is minified with the installed terser, so a
      # dependency bump can change build/ without touching any source above
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup
      with:
        npm-ci: "true"

    # The ICF/BSP handler sources this repository ships to the deploy branches
    - name: Lint frontend/abap
      run: npm run frontend:lint

    # build/ is what gets pushed, so it has to be what the sources produce.
    # Rebuilds the four published trees in place and fails on any difference.
    - name: build/ is up to date
      run: |
        npm run check:frontend || {
          echo "::error::build/ does not match the sources - run 'npm run frontend:build' and commit build/"
          exit 1
        }

    # The renamed variant is not committed (it is built on demand by
    # frontend_deploy), so it is built here into tools/out/: the rename
    # rewrites the generated page and has its own way of going wrong.
    - name: Build a renamed variant
      run: node tools/build-branches.mjs standard_zcheck

    # Same abaplint run the standard branch gets in its own repository
    - name: Lint the generated standard tree
      run: cd build/standard && npx abaplint

    # The invariants a BSP page has to satisfy, checked on the artefact rather
    # than on the bundle it was made from: a page line is at most 255
    # characters, a page name carries no character CREATE_NEW_PAGE rejects, and
    # the preload page is still valid JavaScript once padded.
    - name: Check the BSP page invariants
      run: node tools/check-pages.mjs
