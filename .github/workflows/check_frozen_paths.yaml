name: check_frozen_paths

# Guard for the frozen legacy package src/99 (see AGENTS.md, "Layered Design").
#
# The production code of src/99 is frozen: the retired z2ui5_cl_util* classes
# (99/01), the obsolete built-in popups (99/02) and the legacy XML view
# builders at the top level, superseded by z2ui5_cl_ui5_view_builder in
# src/02/. No framework code, app or tooling consumes it; it ships solely so
# existing downstream installations keep compiling on upgrade, and none of it
# may change here.
#
# The test classes are the exception: *.testclasses.abap and the abapGit
# .clas.xml sidecars (which carry the WITH_UNIT_TESTS flag) are exempt from
# the freeze. They lint and run in the transpiled unit suite, guarding the
# layer against regressions - and because they assert on core internals, they
# must be free to follow those internals when they move.
#
# Moving an object OUT of the package is the other exception, and it follows
# from what the freeze is for. The guarantee is that a downstream installation
# keeps compiling after an upgrade - so what may not happen is a signature
# changing under it, or an object vanishing from the delivery. A file that
# leaves src/99 while the same object keeps shipping from another package
# breaks neither: abapGit installs the repository, not the folder. So a
# deletion is allowed exactly when the object still exists somewhere under
# src/ afterwards, and refused when it does not. Anything edited in place is
# refused either way.
#
# The same reasoning covers an object that was never delivered at all. What
# the freeze protects is the installation that upgrades from the last
# release; an object added after that release has never reached one, so
# dropping it cannot stop anything from compiling. A deletion is therefore
# also allowed when the object is absent from the latest release tag - which
# is a fact about the tag, not a list of names this gate has to maintain.
#
# AGENTS.md says so in prose, which is a request. The gate itself lives in
# .github/scripts/frozen-paths-gate.mjs, so `npm run check:frozen` and this
# workflow decide the same way. This is the guarantee.

on:
  pull_request:

concurrency:
  group: check_frozen_paths-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check_frozen_paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fail on changes under src/99
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/frozen-paths-gate.mjs
