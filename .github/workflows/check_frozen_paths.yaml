name: check_frozen_paths

# Guard for the frozen legacy package src/99 (see AGENTS.md, "Layered Design").
#
# The production code of src/99 is frozen: the retired z2ui5_cl_util* classes
# (99/01), the obsolete built-in popups (99/02) and the legacy XML view
# builder at the top level, superseded by z2ui5_cl_ai_xml in src/02/. No
# framework code, app or tooling consumes it; it ships solely so existing
# downstream installations keep compiling on upgrade, and none of it may
# change here.
#
# The test classes are the exception: *.testclasses.abap and the abapGit
# .clas.xml sidecars (which carry the WITH_UNIT_TESTS flag) are exempt from
# the freeze. They lint and run in the transpiled unit suite, guarding the
# layer against regressions - and because they assert on core internals, they
# must be free to follow those internals when they move.
#
# AGENTS.md says so in prose, which is a request. This is the guarantee.

on:
  pull_request:

permissions:
  contents: read

jobs:
  check_frozen_paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fail on changes under src/99
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # The base commit is not guaranteed to be present on a shallow or
          # merge-ref checkout; fetch it before diffing.
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true

          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- src/99 \
            ':(exclude)src/99/*.testclasses.abap' ':(exclude)src/99/*.clas.xml')

          if [ -n "$changed" ]; then
            echo "::error::src/99 production code is frozen - these files must not change:"
            echo "$changed" | sed 's/^/  /'
            echo ""
            echo "src/99 is kept only so downstream apps keep compiling."
            echo "The XML view builder is being replaced by the ai-demokit"
            echo "version; that work does not happen in this repository."
            echo "See AGENTS.md, 'Layered Design'."
            exit 1
          fi

          echo "src/99 untouched."
