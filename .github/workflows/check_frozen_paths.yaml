name: check_frozen_paths

# Guard for the historical package src/99 (see AGENTS.md, "Layered Design").
#
# src/99 is history only: the retired z2ui5_cl_util* classes (99/01), the
# obsolete built-in popups (99/02) and the legacy XML view builder at the top
# level, superseded by z2ui5_cl_ai_xml in src/02/. Nothing in this repository
# uses, lints or tests it anymore - it is excluded from abaplint and from the
# transpiled test backend; only the 702 downport still converts it so the 702
# release stays compilable for existing downstream installations. It ships
# solely for those installations, and the repository must work identically if
# the folder is deleted. Until that deletion, none of it may change here.
#
# AGENTS.md says so in prose, which is a request. This is the guarantee.
#
# Deliberately limited to src/99: no workflow in this repository writes there
# (both abaplint configs exclude /src/99, and auto_downport pushes
# to the 702 branch rather than a PR), so this gate has no legitimate
# exception. The other never-edit-by-hand paths - src/00/01, src/00/02 and
# src/01/03 - are written by the mirror and app2abap bots via pull requests
# and would need an author exemption before they can be guarded the same way.

on:
  pull_request:

permissions:
  contents: read

jobs:
  check_frozen_paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fail on changes under src/99
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # The base commit is not guaranteed to be present on a shallow or
          # merge-ref checkout; fetch it before diffing.
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true

          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- src/99)

          if [ -n "$changed" ]; then
            echo "::error::src/99 is frozen - these files must not change:"
            echo "$changed" | sed 's/^/  /'
            echo ""
            echo "src/99 is kept only so downstream apps keep compiling."
            echo "The XML view builder is being replaced by the samples-controls"
            echo "version; that work does not happen in this repository."
            echo "See AGENTS.md, 'Layered Design'."
            exit 1
          fi

          echo "src/99 untouched."
