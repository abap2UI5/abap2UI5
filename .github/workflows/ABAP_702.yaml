name: ABAP_702

on:
  push:
    branches: [702]
  workflow_run:
    workflows: [auto_downport]
    types: [completed]

concurrency:
  # the job always checks out the 702 branch, so all triggers coalesce
  group: ABAP_702
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ABAP_702:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 702
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
    - run: npm run deps
    - run: npx abaplint .github/abaplint/abap_702.jsonc
