name: render-gate

# The linter's render gate, over this repository's own app classes.
#
# abap2UI5 asks four other repositories to pass this gate and did not run it
# itself. The reason was good as far as it went - @abap2ui5/render-runtime is
# ~123 MB of UI5 and the shared setup action runs `npm ci` for every job, so
# putting it in devDependencies makes seventeen workflows pay for a check that
# concerns two of them - but the conclusion did not follow. A job of its own
# installs it once, here, and nothing else changes.
#
# It is also not the same test as node/srv's Playwright suite, which was the
# other half of the old argument. That suite proves the SHIPPED apps work end
# to end. This proves every view a class builds survives a real
# XMLView.create, including the ones no shipped app routes to.
#
# Measured when it was written: 24 files, 5 documents rendered, 19 built in
# helper methods and skipped, no findings, 9.6 seconds of gate.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'abap2ui5lint.jsonc'
      - '.github/workflows/render-gate.yaml'
      # The lock decides WHICH linter renders: the install step below reads the
      # version out of it, so a bump changes what this gate does more than a
      # config edit ever could - and it was the one input that did not start
      # the gate. bump-linter.yaml runs check:render itself, so an automated
      # bump was covered; a lock moved by hand was not.
      - 'package-lock.json'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # The composite action, not a literal node-version: it reads .nvmrc and
    # brings the npm cache with it, which this job wants most of all - it runs
    # `npm ci` below on every src/** pull request and was doing it uncached.
    # npm-ci stays off: the install step below adds the render runtime in the
    # same command and has to stay one step.
    - uses: ./.github/actions/setup

    # The linter comes from the lockfile like everywhere else; the render
    # runtime is added here only, and deliberately NOT saved - a devDependency
    # would put it back into every other job's install.
    - name: Install the linter and the render runtime
      run: |
        set -euo pipefail
        npm ci --no-audit --no-fund
        VER=$(node -p "require('./package-lock.json').packages['node_modules/@abap2ui5/linter'].version")
        echo "linter $VER (from package-lock.json)"
        # Same version: the two packages are cut from one tag, and the peer
        # range is what fails if that ever stops being true.
        npm i --no-save --no-audit --no-fund "@abap2ui5/render-runtime@$VER"

    # version+engine-keyed browser cache, the same pattern as test.yaml's
    # browser matrix - this job runs on every src/** pull request and was
    # re-downloading the identical Chromium build each time
    - name: Get Playwright version
      id: playwright-version
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-chromium-${{ steps.playwright-version.outputs.version }}
    - name: Chromium for the render gate
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium
    - name: Chromium OS dependencies (browser cached)
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium

    - name: Every view this repository builds survives XMLView.create
      run: npm run check:render
