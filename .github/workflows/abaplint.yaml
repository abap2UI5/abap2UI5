name: abaplint

# Every abaplint run a pull request needs, on one runner.
#
# These were three workflows - ABAP_STANDARD, ABAP_CLOUD and test_rename -
# that shared their whole expensive half (npm ci plus `npm run deps`, which
# fetches the abaplint dependencies) and differed only in which config they
# then handed to abaplint. The install was being paid three times for three
# runs of a few seconds each.
#
# ABAP_702 stays its own workflow: it lints the downported 702 branch, so it
# checks out a different ref on a different trigger and shares nothing with
# these but the tool.

# Pull requests AND pushes to main - `auto_downport.yaml` rebuilds the 702
# branch from every push to main, so main being lintable is what that rebuild
# assumes. Same pattern as frontend_check.yaml.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: abaplint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  abaplint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          deps: "true"

      # Four full parses of the sources, each ~18 s and independent of the
      # others, used to be four sequential steps - a minute of wall time for
      # what two cores finish in half. Two pairs now, each pair in one step
      # through run-concurrent.mjs, which buffers every child's output and
      # prints it afterwards under a log group per command, in order, so a
      # red parse is still named and the other one's findings are still
      # reported (both children run to the end before the step fails). Not a
      # matrix: the install this workflow exists to pay once would be paid
      # per leg (see the header).
      - name: Standard ABAP and ABAP Cloud
        if: ${{ !cancelled() }}
        run: node .github/scripts/run-concurrent.mjs "npm run check:standard" "npm run check:cloud"

      # The formatting rules - indentation, keyword_case, line_length,
      # align_parameters, whitespace_end, sequential_blank, space_before_colon
      # and _dot - are `false` in abaplint.jsonc and `true` only in the autofix
      # config, so nothing checked them: `auto_abaplint_fix.yaml` runs weekly
      # and opens a pull request, which means a week of drift is normal and
      # unformatted code merges in between. check:format is the same config
      # with the --fix left off, so the rules that write the house format also
      # decide whether it is there. `npm run auto_abaplint` is the fix.
      #
      # The rename rides in the same step: it writes a full renamed copy of
      # the sources to .github/abaplint/output/, which no other check reads.
      # Same config build-rename uses for the real rename_<name> branches,
      # against the placeholder namespace.
      - name: House format and namespace rename
        if: ${{ !cancelled() }}
        run: node .github/scripts/run-concurrent.mjs "npm run check:format" "npm run rename"
