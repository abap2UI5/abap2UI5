name: abaplint

# Every abaplint run a pull request needs, on one runner.
#
# These were three workflows - ABAP_STANDARD, ABAP_CLOUD and test_rename -
# that shared their whole expensive half (npm ci plus `npm run deps`, which
# fetches the abaplint dependencies) and differed only in which config they
# then handed to abaplint. The install was being paid three times for three
# runs of a few seconds each.
#
# ABAP_702 stays its own workflow: it lints the downported 702 branch, so it
# checks out a different ref on a different trigger and shares nothing with
# these but the tool.

# Pull requests AND pushes to main - `auto_downport.yaml` rebuilds the 702
# branch from every push to main, so main being lintable is what that rebuild
# assumes. Same pattern as frontend_check.yaml.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: abaplint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  abaplint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          deps: "true"

      - name: Standard ABAP
        if: ${{ !cancelled() }}
        run: npm run check:standard

      # Visibility of the class under test: abaplint does not check it and the
      # transpiler ignores it, so a missing LOCAL FRIENDS only shows up when
      # the class pool is activated in a real system.
      - name: Test classes reach their subject legally
        if: ${{ !cancelled() }}
        run: npm run check_visibility

      - name: ABAP Cloud
        if: ${{ !cancelled() }}
        run: npm run check:cloud

      # The formatting rules - indentation, keyword_case, line_length,
      # align_parameters, whitespace_end, sequential_blank, space_before_colon
      # and _dot - are `false` in abaplint.jsonc and `true` only in the autofix
      # config, so nothing checked them: `auto_abaplint_fix.yaml` runs weekly
      # and opens a pull request, which means a week of drift is normal and
      # unformatted code merges in between. This is the same config with the
      # --fix left off, so the rules that write the house format also decide
      # whether it is there. `npm run auto_abaplint` is the fix.
      - name: Sources are in the house format
        if: ${{ !cancelled() }}
        run: npm run check:format

      # Last, because the rename writes a full renamed copy of the sources to
      # .github/abaplint/output/. Same config build_rename uses for the real
      # rename_<name> branches, against the placeholder namespace.
      - name: Namespace rename
        if: ${{ !cancelled() }}
        run: npm run rename
