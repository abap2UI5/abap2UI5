# Machine gate for the icon floor: every `sap-icon://<name>` shipped by this
# repository exists in the SAP icon font of UI5 1.71, the oldest release
# abap2UI5 supports.
#
# An icon name is checked by nothing else. UI5 resolves it at render time and an
# unknown name is not an error - IconPool finds nothing and the control renders
# with no icon at all, silently, with nothing in abaplint, in the ui5lint gate
# or in the browser console. The defect surfaces months later as "the icon is
# missing", and only on an old system. Two had already shipped that way: the
# developer tools' help button and the legacy popups in src/99, all on
# `sap-icon://information`, a glyph the font gained after 1.71.
#
# .github/scripts/ui5-icon-gate.mjs holds the exemption (src/99 as frozen) and
# the icons already wrong inside it, each printed on every run so the exemption
# is never a silent hole. The name list it compares against is a snapshot of the
# OpenUI5 1.71 icon registry - 1.71 is closed for new features, so it cannot grow.
name: check_ui5_icons

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'app/webapp/**'
      - '.github/scripts/ui5-icon-gate.mjs'
      - '.github/scripts/ui5-icons-1.71.json'
      - '.github/workflows/check_ui5_icons.yaml'

concurrency:
  group: check_ui5_icons-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check_ui5_icons:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: every sap-icon:// name exists in UI5 1.71
        run: node .github/scripts/ui5-icon-gate.mjs
