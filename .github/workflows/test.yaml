name: test

# The tests of this repository, in one workflow, over one transpile.
#
# All three test jobs run the SAME two commands before they can start:
# `npm run downport` (copy src/, abaplint --fix the copy, strip whitespace)
# and `npm run auto_transpile`. Identical inputs, identical output, and it
# was happening three times on every pull request - the most expensive
# non-browser work in the repository, paid for twice over.
#
# So `transpile` does it once and uploads node/output; everything downstream
# downloads it. That matters most for `browser`: splitting the four Playwright
# projects across four runners would otherwise have made it SIX transpiles per
# pull request rather than three.
#
# The trade is honest and worth naming: the three test jobs used to transpile
# concurrently, so moving it ahead of them adds one job start plus the tar
# round trip - call it a minute - to the critical path. The browser matrix
# takes back several times that, because chromium, firefox, webkit and the
# 1.71 gate no longer wait for each other.
#
# Job ids are the ones the three previous workflows used (`test_unit`,
# `test_node`, `test_browser`, `test_unit_js`) because a job id is the check
# name, and a renamed check silently stops being the required one. The matrix
# legs run under `browser`, and `test_browser` is the aggregate that keeps
# that name reportable - a matrix leg's check name carries its parameter, so
# `test_browser` could not be required if it were the matrix itself.

on:
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  transpile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup
      with:
        npm-ci: "true"
    - run: npm run downport
    - run: npm run auto_transpile
    # A tar, not the directory: the transpiler writes thousands of small
    # files and the artifact API charges per file, which turned the upload
    # into the slowest step of the job.
    - name: Pack the transpiled output
      run: tar -czf transpiled.tar.gz -C node output
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: transpiled
        path: transpiled.tar.gz
        retention-days: 1

  test_unit:
    needs: transpile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup
      with:
        npm-ci: "true"
    - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: transpiled
    - run: tar -xzf transpiled.tar.gz -C node
    - run: npm run unit

  test_node:
    needs: transpile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup
      with:
        npm-ci: "true"
    - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: transpiled
    - run: tar -xzf transpiled.tar.gz -C node
    - run: npm run express &
    - name: Wait for server and verify response
      run: |
        for i in $(seq 1 30); do
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 2>/dev/null) || true
          if [ "$HTTP_CODE" != "000" ]; then
            break
          fi
          sleep 1
        done
        if [ "$HTTP_CODE" = "000" ]; then
          echo "::error::Server did not start within 30 seconds"
          exit 1
        fi
        if [ "$HTTP_CODE" != "200" ]; then
          echo "::error::Server returned HTTP $HTTP_CODE"
          curl -s http://localhost:3000
          exit 1
        fi
        BODY_LENGTH=$(curl -s http://localhost:3000 | wc -c)
        if [ "$BODY_LENGTH" -lt 1000 ]; then
          echo "::error::Response body too small ($BODY_LENGTH bytes), likely an error page"
          curl -s http://localhost:3000
          exit 1
        fi
        echo "Server started successfully (HTTP $HTTP_CODE, $BODY_LENGTH bytes)"

  browser:
    needs: transpile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One engine failing is a fact about that engine - the other three
      # still have to report, or a webkit-only break hides the state of
      # chromium behind it.
      fail-fast: false
      matrix:
        include:
        - project: chromium
          browser: chromium
        - project: firefox
          browser: firefox
        - project: webkit
          browser: webkit
        # The pinned OpenUI5 1.71 gate: the oldest supported release, run as
        # an executable check for the 1.71 compatibility rules (AGENTS.md
        # rules 12, 13, 15-18) instead of reviewer lore. Chromium engine,
        # different bootstrap - see playwright.config.js.
        - project: ui5-1.71
          browser: chromium
    name: browser (${{ matrix.project }})
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup
      with:
        npm-ci: "true"
    - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: transpiled
    - run: tar -xzf transpiled.tar.gz -C node
    - name: Get Playwright version
      id: playwright-version
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    # Keyed by engine as well as version: each leg installs only the browser
    # it runs, so the three caches are different sets and one key for all of
    # them would serve whichever leg wrote first.
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright-version.outputs.version }}
    - name: Install Playwright browser
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps ${{ matrix.browser }}
    - name: Install Playwright OS dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps ${{ matrix.browser }}
    - name: Run browser tests against the transpiled backend
      run: cd node && npx playwright test --config=playwright.config.js --project=${{ matrix.project }}

  test_browser:
    # The required check. The matrix legs above are what actually runs; this
    # job exists so branch protection has one stable name to require.
    needs: browser
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: every browser leg passed
      run: |
        if [ "${{ needs.browser.result }}" != "success" ]; then
          echo "::error::a browser leg did not pass (${{ needs.browser.result }}) - see the browser (…) jobs"
          exit 1
        fi
        echo "all browser legs passed"

  test_unit_js:
    # The frontend unit specs run against app/webapp directly - no ABAP, so
    # no transpile to wait for.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup
      with:
        npm-ci: "true"
    - name: Run JS unit tests
      run: npm run check:js
