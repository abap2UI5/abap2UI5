# Machine gate for the object-naming convention: everything outside the public
# API carries the `ui5` segment - z2ui5_cl_ui5_* / z2ui5_if_ui5_* for the engine,
# z2ui5_cl_ui5f_* for the generated frontend artefacts under src/01/03.
#
# abaplint's own object_naming rule only checks the z2ui5 prefix, so a new
# z2ui5_cl_foo_bar under src/01 passes every other lint we run. Two segments had
# drifted before this gate existed - the embedded frontend sat under
# z2ui5_cl_app_* (colliding with the real ABAP apps in src/02) and the engine
# under z2ui5_cl_core_* - and unpicking that cost two sweeps over ~140 files.
#
# .github/scripts/object-naming-gate.mjs holds the exemptions (src/02 as a stable
# contract, src/99 as frozen, src/00/01 + src/00/02 as force-synced mirrors) and
# the scheduled-but-not-done list, each with its reason printed on a finding.
name: check_object_naming

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - '.github/scripts/object-naming-gate.mjs'
      - '.github/workflows/check_object_naming.yaml'

concurrency:
  group: check_object_naming-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check_object_naming:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: internal object names carry the ui5 segment
        run: node .github/scripts/object-naming-gate.mjs
