name: check_v2_sdk

# The v2 branches bootstrap UI5 from a public CDN at the version hard-coded
# in tools/app2app_v2/patch-v2.mjs — the one manually bumped external pin of
# the frontend build. This monthly check fails (and files an issue) when that
# version is no longer served or a newer legacy-free version exists.
#
# It came with the frontend build when that moved into this repository and is
# the only guard on the pin: nothing else notices a CDN version disappearing,
# because a build against a dead bootstrap still produces a perfectly valid
# branch - it just does not start in the browser.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 2 * *'   # monthly

permissions:
  contents: read
  issues: write  # to report failed scheduled runs

jobs:
  check:
    if: github.repository == 'abap2UI5/abap2UI5'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    # Nothing is installed here - the check is a plain Node script - so there
    # is no npm cache worth restoring.
    - uses: ./.github/actions/setup
      with:
        cache: "false"
    - run: node tools/check-v2-sdk.mjs

    - name: Report scheduled failure as issue
      if: failure() && github.event_name == 'schedule'
      uses: ./.github/actions/report-scheduled-failure
