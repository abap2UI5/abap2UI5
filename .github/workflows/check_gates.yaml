name: check_gates

# The static gates of this repository, in one job.
#
# Each of them is a Node script that reads the sources and decides one rule.
# Together they run in under a second. As nine separate workflows they cost
# nine runner starts, nine checkouts and nine toolchain setups - about two
# minutes of CI and nine entries in the checks list - to do that one second
# of work. This is the same set, on one runner.
#
# Every step is `if: ${{ !cancelled() }}`, which is the part that makes the
# merge an improvement rather than a trade: a pull request that trips three
# gates now reports all three in one log, instead of surfacing the next one
# only after the previous has been fixed and pushed.
#
# The reasoning for each rule lives where the rule lives - in the script it
# runs, and for the chain layout in abap2ui5lint.jsonc. That is deliberate:
# a rule and its justification move together. The comments here say only what
# is being checked.
#
# No paths filter, on purpose. Filtering saved nothing measurable at this
# runtime, and a check that does not run cannot be required in the branch
# protection - the filters were quietly making these gates unrequirable.

on:
  pull_request:

concurrency:
  group: check_gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check_gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: the frozen-path gate diffs against the merge base and
      # reads the latest release tag to tell a never-shipped object from a
      # delivered one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The chain-layout gate is the abap2UI5-linter, which is a dependency;
      # the rest are plain Node and need nothing installed.
      - uses: ./.github/actions/setup
        with:
          npm-ci: "true"

      # Each gate is the npm script a developer runs locally, so a failure
      # here names the command that reproduces it.

      - name: src/99 production code is frozen
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run check:frozen

      - name: src/ round-trips through abapGit
        if: ${{ !cancelled() }}
        run: npm run check:abapgit

      - name: src/ is clean under the extended check (SLIN / ATC)
        if: ${{ !cancelled() }}
        run: npm run check:atc

      - name: internal object names carry the ui5 segment
        if: ${{ !cancelled() }}
        run: npm run check:naming

      - name: dynamic name literals resolve to shipped objects
        if: ${{ !cancelled() }}
        run: npm run check:dynamic

      - name: prose names objects that exist
        if: ${{ !cancelled() }}
        run: npm run check:prose

      # the skills say which linter rule already decides a case - a claim about
      # ANOTHER repository, where rule ids are renamed and retired on their own
      # schedule and nothing here moves when they are
      - name: rule ids named in the skills exist
        if: ${{ !cancelled() }}
        run: npm run check:skills

      # a file that exists byte-identical in four repositories has one source,
      # and it is here - the copies drift silently otherwise
      - name: shared files match their source copy
        if: ${{ !cancelled() }}
        run: npm run check:shared

      # the corpus sizes this repository quotes at agents belong to other
      # repositories - held to their generated catalogues, not to memory
      - name: corpus counts match the corpora
        if: ${{ !cancelled() }}
        run: npm run check:counts

      # changelog.txt and the release notes page in abap2UI5/docs are both
      # hand-written and deliberately differ in detail - they may not differ
      # about which releases exist or when they shipped
      - name: the changelog agrees with the published release notes
        if: ${{ !cancelled() }}
        run: npm run check:changelog

      # the four backlogs are generated from backlog/items and the skills'
      # **Backlog:** lines - a hand-edited page is the thing this replaced
      - name: the backlog pages match their items
        if: ${{ !cancelled() }}
        run: npm run check:backlog

      - name: the two version numbers agree
        if: ${{ !cancelled() }}
        run: npm run check:version

      - name: the chain's indent states the view's depth
        if: ${{ !cancelled() }}
        run: npm run check:abap2ui5

      - name: public API unchanged (additions recorded)
        if: ${{ !cancelled() }}
        run: npm run check:api

      - name: the app guide names real API
        if: ${{ !cancelled() }}
        run: npm run check:guide

      - name: every sap-icon:// name exists in UI5 1.71
        if: ${{ !cancelled() }}
        run: npm run check:icons

      # a sap.ui.define dependency the floor does not have 404s and takes the
      # whole component with it - the app is blank, and nothing names the module
      - name: every sap.ui.define dependency exists on the floor
        if: ${{ !cancelled() }}
        run: npm run check:modules

      - name: curated formatters stay a marshalling layer, not app logic
        if: ${{ !cancelled() }}
        run: npm run check:formatter

      - name: every FOR TESTING method asserts something
        if: ${{ !cancelled() }}
        run: npm run check:asserts
