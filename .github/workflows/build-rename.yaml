name: build-rename

# Renames all artifacts to a chosen name and pushes the result to the
# branch rename_<name> — ready to pull with abapGit for a parallel
# installation in the same SAP system (see
# https://abap2ui5.github.io/docs/advanced/renaming.html). The name is
# either a customer name (ZMYUI5: z2ui5_cl_ui5_client becomes
# zmyui5_cl_ui5_client, branch rename_zmyui5) or a registered namespace
# (/CA2UI5/: z2ui5_cl_ui5_client becomes /ca2ui5/cl_ui5_client, branch
# rename_ca2ui5; abapGit stores it as #ca2ui5#cl_ui5_client, and the
# target system needs the namespace set up in SE03 and a /CA2UI5/ package
# to pull into). The renaming itself is the plain abaplint rename with the
# checked-in config .github/abaplint/rename.jsonc; this workflow only sets
# the chosen prefix in the config (placeholder "znamespace_") and stores
# the result.
# The branch carries the whole installation: src/03 - the ICF node, its
# handler and the BSP - is renamed with the rest, by tools/bsp_rename, which
# knows the object types abaplint does not (.github/scripts/
# rename-service.mjs). The node becomes /sap/bc/<name>, the BSP <NAME>, and
# the handler calls <prefix>cl_ui5_http_handler. Until 2026-11 the BSP came
# from a second repository, built by its own workflow run.
# With 702 (default on) the same run also pushes rename_<name>_702: the
# renamed tree put in place of src/ and run through `npm run auto_downport` -
# the very pipeline auto_downport.yaml builds the branch 702 with (downport,
# syfixes, the 7.02 checks, drop-bsp), so there is one way to downport, and
# it does not care about the prefix as long as the 25+5 name budget holds -
# then linted with the 702 config before it is pushed. There is no renamed
# cloud variant: the service objects of cloud/src/03 (HTTP service, SCO2,
# SIA*, SUSH) have no renamer (backlog/items/rename-variants-cloud.md).
# Re-running with the same name updates the branch to the current main
# state; without content changes nothing is pushed. The main commit is
# carried as second parent so GitHub shows the branch as "ahead" instead
# of "behind" main.

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "New name: ZMYUI5 (max. 10 characters) or a registered namespace /CA2UI5/ (max. 10 with both slashes)"
        required: true
        type: string
        default: znamespace
      with_702:
        description: "Also build rename_<name>_702 (the renamed tree, downported to 7.02)"
        required: false
        type: boolean
        default: true

# read at the workflow level, write on the one job that pushes the branch -
# the shape every other writing workflow here has. It was `contents: write`
# for the whole workflow, the only one of them.
permissions:
  contents: read

concurrency:
  group: build_rename-${{ inputs.namespace }}
  cancel-in-progress: false

jobs:
  build_rename:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      NAMESPACE: ${{ inputs.namespace }}
    steps:
    # validate the input and derive the object name prefix and the branch
    # name before building. A customer name ZMYUI5 takes the place of z2ui5
    # (prefix zmyui5_), a namespace /CA2UI5/ the place of z2ui5_ (prefix
    # /ca2ui5/) - both at most 10 characters, which keeps a 25-character
    # object name within the 30-character limit (rename.jsonc)
    - name: Derive prefix and branch name
      run: |
        ns=$(printf '%s' "$NAMESPACE" | tr '[:upper:]' '[:lower:]')
        if printf '%s' "$ns" | grep -Eq '^[a-z][a-z0-9_]{0,9}$'; then
          if [ "$ns" = "z2ui5" ]; then
            echo "::error::Name '$NAMESPACE' is the original name - nothing to rename"
            exit 1
          fi
          # the "_" is appended below; a name that already ends in one would
          # become a "__" prefix, which tools/bsp_rename (deriveBackend) reads
          # as the name WITH its separator and so never finds
          case "$ns" in
            *_)
              echo "::error::Name '$NAMESPACE' ends in '_' - give the name without it (ZMYUI5, not ZMYUI5_); the '_' is added"
              exit 1
              ;;
          esac
          prefix="${ns}_"
          name="$ns"
        elif printf '%s' "$ns" | grep -Eq '^/[a-z0-9][a-z0-9_]{0,7}/$'; then
          prefix="$ns"
          name=$(printf '%s' "$ns" | tr -d '/')
        else
          echo "::error::Invalid name '$NAMESPACE' (a customer name: letter + letters/digits/underscore, max. 10 characters, e.g. ZMYUI5 - or a namespace with both slashes, max. 10 characters, e.g. /CA2UI5/)"
          exit 1
        fi
        echo "PREFIX=$prefix" >> "$GITHUB_ENV"
        echo "BRANCH=rename_$name" >> "$GITHUB_ENV"
        echo "Renaming z2ui5_ to $prefix, building branch: rename_$name"

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup
      with:
        # the pinned abaplint dependencies: the rename resolves against the
        # released APIs, the lint of the renamed src/03 against open-abap-core
        deps: "true"

    # the chosen prefix in the rename config, and the abaplint rename; it
    # writes the renamed sources to .github/abaplint/output/src - from a run
    # config at the root, which is what keeps them there from
    # @abaplint/cli 2.120.122 on (rename-run.mjs has why)
    - name: Rename to ${{ inputs.namespace }}
      run: node .github/scripts/rename-run.mjs "$PREFIX"

    # abaplint --rename rewrites references, never string literals: a literal
    # still naming an object by its original name makes the renamed
    # installation look up the ORIGINAL object (every app start refused, no
    # user exit found). check:rename keeps them out of the sources; this
    # proves it on the tree that is about to be pushed
    - name: No literal kept the original name
      run: node .github/scripts/rename-literal-gate.mjs --renamed .github/abaplint/output

    # src/03, which the abaplint rename leaves out (rename.jsonc): renamed by
    # tools/bsp_rename into the output tree and linted there against the
    # renamed framework - the handler's one call has to resolve
    - name: Rename the service package
      run: node .github/scripts/rename-service.mjs "$NAMESPACE"

    # branch content: the renamed src tree plus the abapGit descriptor
    # (version constant turned to the renamed interface) and the license
    - name: Assemble branch content
      run: |
        src=.github/abaplint/output/src
        if [ ! -d "$src" ]; then
          echo "::error::no renamed src folder found under .github/abaplint/output"
          exit 1
        fi
        out=".github/out/$BRANCH"
        rm -rf "$out"
        mkdir -p "$out"
        cp -r "$src" "$out/src"
        cp LICENSE "$out/"
        prefix_upper=$(printf '%s' "$PREFIX" | tr '[:lower:]' '[:upper:]')
        sed "s|Z2UI5_IF_APP|${prefix_upper}IF_APP|" .abapgit.xml > "$out/.abapgit.xml"

    # the 7.02 variant: the renamed src/ in place of the checkout's src/,
    # then exactly what auto_downport.yaml runs - `npm run auto_downport`
    # (it rewrites src/ in place and puts the 702 config at abaplint.jsonc)
    # and a plain `npx abaplint`, the 702 lint of the tree about to be pushed
    - name: Downport the renamed tree to 7.02
      if: ${{ inputs.with_702 }}
      run: |
        rm -rf src
        cp -r ".github/out/$BRANCH/src" src
        npm run auto_downport
        npx abaplint
        node .github/scripts/rename-literal-gate.mjs --renamed src
        out=".github/out/${BRANCH}_702"
        rm -rf "$out"
        mkdir -p "$out"
        cp -r src "$out/src"
        cp LICENSE "$out/"
        cp ".github/out/$BRANCH/.abapgit.xml" "$out/"

    - name: Push renamed branches
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        branches="$BRANCH"
        if [ -d ".github/out/${BRANCH}_702" ]; then branches="$branches ${BRANCH}_702"; fi
        for b in $branches; do
          git fetch origin "$b" --depth 1 2>/dev/null || true
          parent=$(git rev-parse -q --verify "refs/remotes/origin/$b" || true)
          index="$RUNNER_TEMP/index-$b"
          rm -f "$index"
          (cd ".github/out/$b" && GIT_DIR="$GITHUB_WORKSPACE/.git" GIT_WORK_TREE=. GIT_INDEX_FILE="$index" git add -A)
          tree=$(GIT_INDEX_FILE="$index" git write-tree)
          if [ -n "$parent" ] && [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then
            echo "$b: no changes"
            continue
          fi
          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -p "$GITHUB_SHA" -m "build: $b from $GITHUB_SHA")
          git push origin "$commit:refs/heads/$b"
          echo "$b: pushed $commit"
        done
