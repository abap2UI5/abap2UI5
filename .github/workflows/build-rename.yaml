name: build-rename

# Renames all artifacts to a chosen name and pushes the result to the
# branch rename_<name> — ready to pull with abapGit for a parallel
# installation in the same SAP system (see
# https://abap2ui5.github.io/docs/advanced/renaming.html). The name is
# either a customer name (ZMYUI5: z2ui5_cl_ui5_client becomes
# zmyui5_cl_ui5_client, branch rename_zmyui5) or a registered namespace
# (/CA2UI5/: z2ui5_cl_ui5_client becomes /ca2ui5/cl_ui5_client, branch
# rename_ca2ui5; abapGit stores it as #ca2ui5#cl_ui5_client, and the
# target system needs the namespace set up in SE03 and a /CA2UI5/ package
# to pull into). The renaming itself is the plain abaplint rename with the
# checked-in config .github/abaplint/rename.jsonc; this workflow only sets
# the chosen prefix in the config (placeholder "znamespace_") and stores
# the result.
# The frontend BSP that goes with it is built by frontend_deploy with the
# branch name standard_<name>__<name> (standard_#abap2ui5#__#abap2ui5#,
# standard_zmyui5__zmyui5): its ICF handler then calls the renamed backend
# class <prefix>cl_http_handler instead of z2ui5_cl_http_handler (see
# tools/bsp_rename). Run this workflow first - the lint of that build
# reads the backend from the branch rename_<name> pushed here.
# Re-running with the same name updates the branch to the current main
# state; without content changes nothing is pushed. The main commit is
# carried as second parent so GitHub shows the branch as "ahead" instead
# of "behind" main.

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "New name: ZMYUI5 (max. 10 characters) or a registered namespace /CA2UI5/ (max. 10 with both slashes)"
        required: true
        type: string
        default: znamespace

# read at the workflow level, write on the one job that pushes the branch -
# the shape every other writing workflow here has. It was `contents: write`
# for the whole workflow, the only one of them.
permissions:
  contents: read

concurrency:
  group: build_rename-${{ inputs.namespace }}
  cancel-in-progress: false

jobs:
  build_rename:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      NAMESPACE: ${{ inputs.namespace }}
    steps:
    # validate the input and derive the object name prefix and the branch
    # name before building. A customer name ZMYUI5 takes the place of z2ui5
    # (prefix zmyui5_), a namespace /CA2UI5/ the place of z2ui5_ (prefix
    # /ca2ui5/) - both at most 10 characters, which keeps a 25-character
    # object name within the 30-character limit (rename.jsonc)
    - name: Derive prefix and branch name
      run: |
        ns=$(printf '%s' "$NAMESPACE" | tr '[:upper:]' '[:lower:]')
        if printf '%s' "$ns" | grep -Eq '^[a-z][a-z0-9_]{0,9}$'; then
          if [ "$ns" = "z2ui5" ]; then
            echo "::error::Name '$NAMESPACE' is the original name - nothing to rename"
            exit 1
          fi
          prefix="${ns}_"
          name="$ns"
        elif printf '%s' "$ns" | grep -Eq '^/[a-z0-9][a-z0-9_]{0,7}/$'; then
          prefix="$ns"
          name=$(printf '%s' "$ns" | tr -d '/')
        else
          echo "::error::Invalid name '$NAMESPACE' (a customer name: letter + letters/digits/underscore, max. 10 characters, e.g. ZMYUI5 - or a namespace with both slashes, max. 10 characters, e.g. /CA2UI5/)"
          exit 1
        fi
        echo "PREFIX=$prefix" >> "$GITHUB_ENV"
        echo "BRANCH=rename_$name" >> "$GITHUB_ENV"
        echo "Renaming z2ui5_ to $prefix, building branch: rename_$name"

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup
      with:
        npm-ci: "true"

    # set the chosen prefix in the rename config and run the abaplint
    # rename; it writes the renamed sources to
    # .github/abaplint/output/<workspace path>/src. `|` as the sed
    # delimiter: a namespace prefix carries slashes, neither carries a `|`
    - name: Rename to ${{ inputs.namespace }}
      run: |
        sed "s|znamespace_|$PREFIX|g" .github/abaplint/rename.jsonc > .github/abaplint/rename_run.jsonc
        npx abaplint .github/abaplint/rename_run.jsonc --rename

    # abaplint --rename rewrites references, never string literals: a literal
    # still naming an object by its original name makes the renamed
    # installation look up the ORIGINAL object (every app start refused, no
    # user exit found). check:rename keeps them out of the sources; this
    # proves it on the tree that is about to be pushed
    - name: No literal kept the original name
      run: node .github/scripts/rename-literal-gate.mjs --renamed .github/abaplint/output

    # branch content: the renamed src tree plus the abapGit descriptor
    # (version constant turned to the renamed interface) and the license
    - name: Assemble branch content
      run: |
        src=$(find .github/abaplint/output -type d -name src | head -n 1)
        if [ -z "$src" ]; then
          echo "::error::no renamed src folder found under .github/abaplint/output"
          exit 1
        fi
        out=".github/out/$BRANCH"
        rm -rf "$out"
        mkdir -p "$out"
        cp -r "$src" "$out/src"
        cp LICENSE "$out/"
        prefix_upper=$(printf '%s' "$PREFIX" | tr '[:lower:]' '[:upper:]')
        sed "s|Z2UI5_IF_APP|${prefix_upper}IF_APP|" .abapgit.xml > "$out/.abapgit.xml"

    - name: Push renamed branch
      run: |
        b="$BRANCH"
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git fetch origin "$b" --depth 1 2>/dev/null || true
        parent=$(git rev-parse -q --verify "refs/remotes/origin/$b" || true)
        index="$RUNNER_TEMP/index-$b"
        rm -f "$index"
        (cd ".github/out/$b" && GIT_DIR="$GITHUB_WORKSPACE/.git" GIT_WORK_TREE=. GIT_INDEX_FILE="$index" git add -A)
        tree=$(GIT_INDEX_FILE="$index" git write-tree)
        if [ -n "$parent" ] && [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then
          echo "$b: no changes"
          exit 0
        fi
        commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -p "$GITHUB_SHA" -m "build: $b from $GITHUB_SHA")
        git push origin "$commit:refs/heads/$b"
        echo "$b: pushed $commit"
