name: auto-cloud

# Publishes the branch `cloud` - abap2UI5 for ABAP Cloud - from main, the way
# auto_downport publishes `702`: main is the source, the branch is generated,
# nobody commits to it. What it carries and why is the header of
# tools/build-cloud.mjs.
#
# Scoped by paths: the branch is a function of src/, cloud/, app_source/ and
# the build - a docs-only push to main changed none of its inputs. Not a
# required check, so a paths filter is safe here.
#
# The tree is published as ONE commit whose parent is the main commit it was
# built from and whose content is the built tree and nothing else - so the
# branch is always exactly one commit ahead of main, and `git log cloud`
# reads as main's history. A push whose tree equals the one already
# published is skipped: a commit that moves the provenance forward without
# moving the content is noise in an installation source.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'cloud/**'
      - 'app_source/**'
      - 'tools/build-cloud.mjs'
      - '.abapgit.xml'
      - 'LICENSE'
      - '.github/workflows/auto-cloud.yaml'
      - '.github/actions/**'

concurrency:
  group: auto-cloud

permissions:
  contents: read

jobs:
  auto-cloud:
    if: github.repository == 'abap2UI5/abap2UI5'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: ./.github/actions/setup
      with:
        # the two lints below need abaplint and its pinned dependencies
        deps: "true"

    - name: Build the tree
      run: node tools/build-cloud.mjs

    # Lint what is about to be published, as auto_downport does: the
    # framework under the ABAP Cloud profile, and the package the branch
    # carries in place of src/03.
    - name: Lint the framework for ABAP Cloud and the cloud service package
      run: npm run check:cloud && npm run check:service

    # Plumbing instead of a checkout: the tree is written from tools/out/cloud
    # through an index of its own, so the working tree and its index are never
    # touched and nothing that is not in the built tree can end up in the
    # commit. The Source-Commit trailer names the main commit, as on 702.
    - name: Commit and push the branch
      run: |
        set -euo pipefail
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'

        export GIT_INDEX_FILE="$RUNNER_TEMP/cloud.index"
        rm -f "$GIT_INDEX_FILE"
        git --work-tree=tools/out/cloud add -A -f .
        tree=$(git write-tree)
        unset GIT_INDEX_FILE

        if git fetch --quiet --depth 1 origin cloud 2>/dev/null; then
          if [ "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$tree" ]; then
            echo "the tree matches the published branch, nothing to push"
            exit 0
          fi
        fi

        commit=$(git commit-tree "$tree" -p "$GITHUB_SHA" -m "Cloud branch" -m "Source-Commit: $GITHUB_SHA")
        git push --force origin "$commit:refs/heads/cloud"
