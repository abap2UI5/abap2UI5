name: auto-cloud

# Publishes the branch `cloud` - abap2UI5 for ABAP Cloud - from main, the way
# auto_downport publishes `702`: main is the source, the branch is generated,
# nobody commits to it. What it carries and why is the header of
# tools/build-cloud.mjs.
#
# Every push to main: the branch carries the whole repository, as 702 does,
# so every commit on main is an input - there is no paths filter to scope
# it by. Not a required check.
#
# The tree is main's, with the built tree of tools/out/cloud laid over it -
# src/ with cloud/src/03 in place of src/03, app/, .abapgit.xml,
# abaplint.jsonc, README.md - and published as ONE commit on top of the main
# commit it was built from: the branch is always exactly one commit ahead of
# main and never behind it, and `git log cloud` reads as main's history.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: auto-cloud

permissions:
  contents: read

jobs:
  auto-cloud:
    if: github.repository == 'abap2UI5/abap2UI5'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: ./.github/actions/setup
      with:
        # the two lints below need abaplint and its pinned dependencies
        deps: "true"

    - name: Build the tree
      run: node tools/build-cloud.mjs

    # Lint what is about to be published, as auto_downport does: the
    # framework under the ABAP Cloud profile, and the package the branch
    # carries in place of src/03.
    - name: Lint the framework for ABAP Cloud and the cloud service package
      run: npm run check:cloud && npm run check:service

    # and the tree itself, with the abaplint.jsonc it carries - the config
    # somebody who clones the branch lints with
    - name: Lint the built tree with its own config
      working-directory: tools/out/cloud
      run: npx abaplint

    # As auto_downport: the checkout of main is rewritten in place and
    # committed on top of the commit it was built from. src/ and app/ are
    # replaced as a whole, so nothing of main's src/03 survives in the branch's src/;
    # tools/out/ is git-ignored and stays behind. The Source-Commit trailer
    # names the main commit, as on 702.
    - name: Commit and push the branch
      run: |
        set -euo pipefail
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        rm -rf src app
        cp -r tools/out/cloud/. .
        git add .
        git commit -m "Cloud branch" -m "Source-Commit: $GITHUB_SHA"
        git push --force origin HEAD:refs/heads/cloud
