name: UI5_2X

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: UI5_2X-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  UI5_2X:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - uses: ./.github/actions/setup
      with:
        app-npm-ci: "true"
    - name: ui5lint (fails on any error)
      run: npm run check:ui5
    - name: eslint
      run: cd app && npm run lint
