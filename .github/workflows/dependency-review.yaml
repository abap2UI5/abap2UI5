name: dependency-review

# What a pull request adds to the dependency tree, before it is merged.
#
# This repository had no supply-chain check of any kind: no CodeQL, no
# dependency review, no `npm audit` anywhere. That is not an abstract gap here.
# Everything the framework ships to an ABAP system is GENERATED by these
# dependencies - `src/01/03/` by the app2abap pipeline, the four delivery trees
# by terser and the UI5 tooling - and `frontend_deploy.yaml` pushes those trees
# into an installation source people's abapGit repositories point at. A
# compromised build dependency reaches real systems through a path no ABAP
# review looks at.
#
# It reports on the DIFF, which is what makes it a pull-request gate rather
# than a report nobody opens: a known-vulnerable package or a licence change
# fails the pull request that introduces it, and nothing is said about the
# hundreds of dependencies that were already there. `dependabot.yml` moves the
# lockfiles; this is what looks at what it moved.
#
# The root lockfile and app/package-lock.json are both read - the Fiori project
# is a second dependency tree, and it is the one Prettier and the UI5 linter
# come from.

on:
  pull_request:

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review the dependencies this pull request adds
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # `low` would report on a build-time dev dependency's transitive
          # advisory on most weeks and train everyone to click past it. The
          # threshold is where it can stay red until somebody acts.
          fail-on-severity: moderate
          # Both are MIT, and so is everything they pull in today. Naming the
          # copyleft licences makes a change of that a decision rather than a
          # thing that happens: the generated frontend is embedded verbatim into
          # ABAP classes that ship to customer systems.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.1, LGPL-3.0
