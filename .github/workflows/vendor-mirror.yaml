name: vendor-mirror

# Refreshes the vendored upstream sources under src/00/ from their mirror
# repositories and opens a PR with the diff.
#
# This was three files: a reusable workflow plus one thin caller per mirror,
# where a caller was a schedule and three strings. The strings are a matrix
# now, so adding a third mirror is a line rather than a file, and the
# workflow_call indirection - which existed only to serve those two callers -
# is gone.
#
# A dispatch refreshes both mirrors. They are independent legs opening
# independent PRs, and a run that finds no change opens nothing, so there is
# nothing to gain from being able to name one.

# no schedule: bump-deps.yaml does this once a month, in its one
# pull request; a dispatch still runs it on its own
on:
  workflow_dispatch:

# No cancel-in-progress: a run mid-way through opening a mirror PR should
# finish. The group stops two dispatches from opening the same PR twice.
concurrency:
  group: mirror

permissions:
  contents: read

jobs:
  mirror:
    # Origin repo only
    if: github.repository == 'abap2UI5/abap2UI5'
    permissions:
      contents: write  # for peter-evans/create-pull-request to create branch
      pull-requests: write  # for peter-evans/create-pull-request to create a PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: mirror-ajson
            path: src/00/01
            pr: mirror-ajson-update
          - repo: mirror-srtti
            path: src/00/02
            pr: mirror-srtti-update
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: run
      env:
        MIRROR_REPO: ${{ matrix.repo }}
        TARGET_PATH: ${{ matrix.path }}
      run: |
        git clone "https://github.com/abap2UI5/$MIRROR_REPO.git"
        rm "$TARGET_PATH"/z*
        cp "$MIRROR_REPO"/src/z* "$TARGET_PATH"/
        rm -rf "$MIRROR_REPO"
        git status
    - name: Open PR
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        title: ${{ matrix.pr }}
        branch: ${{ matrix.pr }}
