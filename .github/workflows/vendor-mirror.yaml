name: vendor-mirror

# Refreshes the vendored ajson (src/00/01) and S-RTTI (src/00/02) from the
# mirror repositories of abap-util and opens one PR with the diff (none when
# nothing changed).
#
# The mirrors rename their upstream to abap-util's prefix (zabaputil_) and
# apply their local patches; abap-util takes them as they are.
# .github/scripts/vendor-mirror.mjs clones both, takes the objects this
# repository uses and renames each one to this repository's name for it
# (z2ui5_cl_ui5_ajs, z2ui5_cl_ui5_srt_type, ...): the table is
# .github/vendor-mirror.json, why it is a table the script's header.

# no schedule: bump-deps.yaml does this once a month, in its one
# pull request; a dispatch still runs it on its own
on:
  workflow_dispatch:

# No cancel-in-progress: a run mid-way through opening a mirror PR should
# finish. The group stops two dispatches from opening the same PR twice.
concurrency:
  group: mirror

permissions:
  contents: read

jobs:
  mirror:
    # Origin repo only
    if: github.repository == 'abap2UI5/abap2UI5'
    permissions:
      contents: write  # for peter-evans/create-pull-request to create branch
      pull-requests: write  # for peter-evans/create-pull-request to create a PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: run
      run: |
        node .github/scripts/vendor-mirror.mjs
        git status
    - name: Open PR
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        title: vendor-mirror-update
        branch: vendor-mirror-update
