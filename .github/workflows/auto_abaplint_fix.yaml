name: auto_abaplint_fix

# Once a month, on the last Sunday - the day the repository collects its
# dependency updates too (bump-deps.yaml). GitHub's cron cannot say "the last
# Sunday", so the schedule fires every Sunday and the job `when` picks the
# last one of the month. A dispatch always runs.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'   # Sundays 03:00 UTC - `when` picks the last one of the month

# No cancel-in-progress: a run that is already opening a pull request should
# finish. The group is what keeps a hand dispatch and the cron from doing
# that twice at once.
concurrency:
  group: auto_abaplint_fix

permissions:
  contents: read

jobs:
  when:
    if: github.repository == 'abap2UI5/abap2UI5'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.when.outputs.go }}
    steps:
      - id: when
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$(date -u -d '+7 days' +%m)" = "$(date -u +%m)" ]; then
            echo "not the last Sunday of the month"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  auto_abaplint_fix:
    needs: when
    if: needs.when.outputs.go == 'true'
    permissions:
      contents: write
      pull-requests: write
      issues: write  # to report failed scheduled runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          npm-ci: "true"

      - name: run transformation
        run: npm run auto_abaplint

      - name: Open PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          title: abaplint-auto-fixes-formatting
          branch: abaplint-auto-fixes-formatting
      - name: Report scheduled failure as issue
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/report-scheduled-failure
