name: auto_abaplint_fix

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  auto_abaplint_fix:
    if: github.repository == 'abap2UI5/abap2UI5'
    permissions:
      contents: write
      pull-requests: write
      issues: write  # to report failed scheduled runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          npm-ci: "true"

      - name: run transformation
        run: npm run auto_abaplint

      - name: Open PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          title: abaplint-auto-fixes-formatting
          branch: abaplint-auto-fixes-formatting
      - name: Report scheduled failure as issue
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/report-scheduled-failure
