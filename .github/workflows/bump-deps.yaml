name: bump-deps

# Every dependency update of this repository, once a month, in ONE pull
# request - on the last Sunday of the month. Nothing else updates
# dependencies on a schedule: no Dependabot version updates, and the bump
# workflows that used to open a pull request each (where there are any) run
# only by hand now. Dependabot's security updates are a repository setting
# and stay as they are.
#
# GitHub's cron cannot say "the last Sunday": a day of the month and a day of
# the week in one expression mean either, not both. So the schedule fires
# every Sunday and the first step goes on only when a week later is another
# month. A manual dispatch always goes on.
#
# .github/shared/update-deps.mjs does the npm part (every package.json with
# a lockfile, latest versions, the lockfile refreshed) and, with --actions,
# moves every pinned action to its latest release. The default token may not
# change files under .github/workflows/, so those moves reach the pull
# request only when the secret DEPS_TOKEN exists (a token that may push
# workflow files) - without it the pull request carries everything else. It
# is the SOURCE of the .github/scripts/update-deps.mjs every other repository
# carries (check:shared), so this repository runs the source rather than a
# copy.
#
# Two jobs, because npm installs freshly published packages and runs their
# install scripts - and anything run in a job can tamper with the later steps
# of that job ($GITHUB_ENV, $GITHUB_PATH, the files they execute). `update`
# runs npm and the mirror refresh with no secret at all: a read-only token,
# no credential in .git/config, and --actions reads the latest releases
# (public data) with that read-only token. What it changed goes to `pr` as a
# patch. `pr` is the only job DEPS_TOKEN reaches, and it runs nothing of the
# repository's: a fresh checkout, the patch, the pull request.

on:
  schedule:
    - cron: '17 4 * * 0'   # Sundays 04:17 UTC - the first step picks the last one of the month
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bump-deps
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'abap2UI5/abap2UI5'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      go: ${{ steps.when.outputs.go }}
    steps:
    - name: Only on the last Sunday of the month
      id: when
      run: |
        if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$(date -u -d '+7 days' +%m)" = "$(date -u +%m)" ]; then
          echo "not the last Sunday of the month - nothing to do"
          echo "go=false" >> "$GITHUB_OUTPUT"
        else
          echo "go=true" >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: steps.when.outputs.go == 'true'
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: steps.when.outputs.go == 'true'
      with:
        node-version: '22'

    # --actions on every run: reading a release needs no more than the job's
    # read-only token; whether the moved pins under .github/workflows may be
    # pushed is decided in `pr`, by DEPS_TOKEN
    - name: npm dependencies and GitHub Actions
      if: steps.when.outputs.go == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: node .github/shared/update-deps.mjs --actions --summary "$RUNNER_TEMP/summary.md"

    # the vendored upstream sources under src/00/ from their mirror
    # repositories (was vendor-mirror.yaml's schedule)
    - name: Refresh the vendored mirrors
      if: steps.when.outputs.go == 'true'
      run: |
        set -euo pipefail
        for repo in mirror-ajson mirror-srtti; do
          git clone --quiet --depth 1 "https://github.com/abap-util/$repo.git" "$RUNNER_TEMP/$repo"
        done
        node .github/scripts/vendor-mirror.mjs "$RUNNER_TEMP/mirror-ajson" "$RUNNER_TEMP/mirror-srtti"
        if ! git diff --quiet -- src/00; then
          # the backticks are Markdown, not a shell expansion
          # shellcheck disable=SC2016
          printf '**Vendored mirrors**\n\n- `src/00/01` (ajson) and `src/00/02` (srtti) refreshed from abap-util/mirror-ajson and abap-util/mirror-srtti\n\n' >> "$RUNNER_TEMP/summary.md"
        fi

    # everything changed, new files and deleted ones included, as one binary
    # patch against the commit `pr` checks out again (.gitignore keeps
    # node_modules out of it)
    - name: Hand the changes over
      if: steps.when.outputs.go == 'true'
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/bump-deps"
        git add -A
        git diff --cached --binary > "$RUNNER_TEMP/bump-deps/changes.patch"
        cp "$RUNNER_TEMP/summary.md" "$RUNNER_TEMP/bump-deps/summary.md"
        git diff --cached --stat
    - if: steps.when.outputs.go == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: bump-deps
        path: ${{ runner.temp }}/bump-deps/
        if-no-files-found: error
        retention-days: 1

  # The only job with a write token and the only one DEPS_TOKEN reaches. It
  # runs no npm and no script of the repository: a fresh checkout of the same
  # commit, the patch laid over it, the pull request. create-pull-request
  # authenticates with its own token input
  pr:
    needs: update
    if: needs.update.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: bump-deps
        path: ${{ runner.temp }}/bump-deps
    - name: Lay the changes over the checkout
      run: |
        set -euo pipefail
        if [ -s "$RUNNER_TEMP/bump-deps/changes.patch" ]; then
          git apply --binary "$RUNNER_TEMP/bump-deps/changes.patch"
        fi
        git status --short

    # the default token may not push a change to a workflow file - without
    # DEPS_TOKEN such changes (a moved action, a shared workflow copy) wait
    # for the next run
    - name: Without DEPS_TOKEN, leave workflow files out
      env:
        HAS_DEPS_TOKEN: ${{ secrets.DEPS_TOKEN != '' }}
      run: |
        if [ "$HAS_DEPS_TOKEN" != "true" ] && [ -n "$(git status --porcelain -- .github/workflows)" ]; then
          git checkout -- .github/workflows
          git clean -fdq -- .github/workflows
          printf -- '- left out: changes to .github/workflows (they need the DEPS_TOKEN secret)\n' >> "$RUNNER_TEMP/bump-deps/summary.md"
        fi

    - name: Open the monthly pull request
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ secrets.DEPS_TOKEN || github.token }}
        branch: bump-deps
        delete-branch: true
        title: Monthly dependency update
        commit-message: Monthly dependency update
        body-path: ${{ runner.temp }}/bump-deps/summary.md
