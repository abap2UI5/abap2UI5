name: Bug report
description: Report a problem with the abap2UI5 framework
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Drafted by an AI assistant? The abap2UI5 MCP server's `report_issue` tool fills this form in -
        read it before you submit. Its field ids (description, reproduction, version, environment,
        context) are what it fills; keep them when you change this form.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: Minimal app code or steps that trigger the problem - best a complete class that reproduces it without a system (the MCP server's verify_app runs it), so a maintainer reproduces it in one call.
      render: abap
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: abap2UI5 version
      description: See constant `version` in z2ui5_if_app (e.g. 1.142.0).
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: ABAP environment
      description: NW 7.02 / standard ABAP (release) / ABAP Cloud, plus UI5 version if frontend-related.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Error messages, screenshots, launchpad vs. standalone, custom exit classes, etc. - and whether an AI assistant found it (which one).
