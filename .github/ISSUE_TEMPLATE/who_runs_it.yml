name: Who runs it - add your company
description: Running abap2UI5? Add your company to "Who runs it" on abap2ui5.github.io/why - one row, public, checked by a maintainer before it goes live.
title: "Who runs it: <company>"
labels: ["who-runs-it"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Every row on [Who runs it](https://abap2ui5.github.io/why/#who-runs-it) tells the next reader that abap2UI5 runs in their industry too. Only what you write here is published; nothing is looked up or added.
  - type: input
    id: company
    attributes:
      label: Company
      description: The name as it should appear on the page.
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Website
      placeholder: https://
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: How you use it
      options:
        - In production
        - Pilot
        - Training or consulting
    validations:
      required: true
  - type: input
    id: what
    attributes:
      label: What the apps do
      description: One line, e.g. "Apps for warehouse management, on mobile devices".
    validations:
      required: true
  - type: input
    id: since
    attributes:
      label: Since
      placeholder: "2025"
  - type: checkboxes
    id: consent
    attributes:
      label: Permission
      options:
        - label: I am allowed to speak for this company and agree to the row above being published on abap2ui5.github.io/why.
          required: true
