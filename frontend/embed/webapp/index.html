<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>abap2UI5</title>
    <style>
      html,
      body,
      body > div,
      #container,
      #container-uiarea {
        height: 100%;
      }
    </style>
    <!-- Nothing of the abap2UI5 frontend here: the one control of the view
         loads it from the abap2UI5 service of this system
         (/sap/bc/z2ui5?z2ui5-bundle), so it always has the version of the
         backend it talks to -->
    <script
      id="sap-ui-bootstrap"
      src="resources/sap-ui-core.js"
      data-sap-ui-theme="sap_horizon"
      data-sap-ui-resourceroots='{
            "z2ui5": "./",
            "abap2ui5.frontend": "./"
        }'
      data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
      data-sap-ui-compatVersion="edge"
      data-sap-ui-async="true"
      data-sap-ui-frameOptions="trusted"
    ></script>
  </head>
  <body class="sapUiBody sapUiSizeCompact" id="content">
    <div
      data-sap-ui-component
      data-name="z2ui5"
      data-id="container"
      data-settings='{"id" : "z2ui5"}'
      data-handle-validation="true"
    ></div>
  </body>
</html>
